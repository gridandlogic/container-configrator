<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cyan-glow-intense" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
  </defs>
  <!-- Dark Background -->
  <rect width="400" height="400" fill="#000000" rx="40" />

  <!-- Background Circuit Grid Lines subtle -->
  <path d="M40 100 H360 M40 200 H360 M40 300 H360 M100 40 V360 M200 40 V360 M300 40 V360" stroke="#00f3ff" stroke-width="0.75" stroke-opacity="0.12" stroke-dasharray="4 8" />

  <!-- Main G Circuit Structure with Glow -->
  <g filter="url(#cyan-glow)" stroke="#00f3ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="miter" fill="none">
    <!-- Outer Track of G -->
    <path d="M 275 110 L 275 125 M 275 125 L 200 125 L 200 110 M 275 125 L 275 170 M 200 125 L 165 125 L 130 160 L 130 250 L 165 285 L 225 285 L 225 255" />
    
    <!-- Middle Track of G -->
    <path d="M 125 200 L 105 200 L 105 150 L 155 100 L 270 100 L 270 110" />
    <path d="M 105 200 L 105 260 L 155 310 L 245 310 L 245 285" />
    
    <!-- Inner Spur / Core Crossbar -->
    <path d="M 200 175 L 275 175 L 275 220 L 240 220 L 240 200 L 180 200 L 180 245 L 210 245" />
    <path d="M 240 220 L 240 285 L 275 285 L 275 210" />
  </g>

  <!-- Glowing Circuit Terminals / Nodes -->
  <g fill="#00f3ff" filter="url(#cyan-glow)">
    <circle cx="275" cy="110" r="8" />
    <circle cx="200" cy="125" r="8" />
    <circle cx="105" cy="200" r="8" />
    <circle cx="200" cy="175" r="8" />
    <circle cx="275" cy="175" r="8" />
    <circle cx="200" cy="265" r="8" />
    <circle cx="200" cy="285" r="8" />
  </g>
  <g fill="#ffffff">
    <circle cx="275" cy="110" r="3.5" />
    <circle cx="200" cy="125" r="3.5" />
    <circle cx="105" cy="200" r="3.5" />
    <circle cx="200" cy="175" r="3.5" />
    <circle cx="275" cy="175" r="3.5" />
    <circle cx="200" cy="265" r="3.5" />
    <circle cx="200" cy="285" r="3.5" />
  </g>
</svg>
